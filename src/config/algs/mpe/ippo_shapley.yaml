# --- IPPO specific parameters ---

name: "ippo_shapley"
on_policy: True
action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 256
batch_size_run: 8
batch_size: 256


obs_agent_id: True
# obs_last_action: False
obs_state: False # used for mappo critic only
# obs_individual_obs: False # used for cv_critic only
obs_team_composition: False

agent_output_type: "pi_logits"
learner: "ppo_shapley_learner"
agent: "rnn_norm"
critic_type: "ippo_critic"

entropy_coef: 0.05
standardise_rewards: True
use_gae: True # if False, use n-step returns
gae_lambda: 0.95
q_nstep: 5 # 1 corresponds to normal r + gammaV

shapley_loss_coef: 0.01 # the best coef to now is 0.01 / 0.001 for large number of agents
value_loss_coef: 0.5
shaped_reward_coef: 1.0
shaped_reward_coef_anneal: False
shaped_reward_coef_start: 1.0
shaped_reward_coef_end: 0.1
shapley_loss_coef_anneal: False
shapley_loss_coef_start: 0.001
shapley_loss_coef_end: 0.01
truncated_TD_lambda: False # valid only if use_gae=True
m: 10 # horizon of the truncated TD(lambda) above / This is required to investigate deeply
reverse_geometric_distr: False
average_value_diff: False 

# epochs: 4
# n_minibatch: 3
epochs: 5
n_minibatch: 1
eps_clip: 0.1
lr: 0.0005
optim_alpha: 0.99
optim_eps: .00001

use_popart: False # use PopArt to normalize rewards
clip_value_loss: False # limit how much value is allowed to change during PPO epochs
# use_huber_loss: True
use_huber_loss: False
huber_delta: 10.0
use_adv_std: True # standardize advantages

use_obs_norm: True # apply layernorm to normalize inputs
use_orthogonal_init: True # if False, use xavier uniform initialization, else use orthogonal

trainable_agents_mask_actor: True # applies to open train only
trainable_agents_mask_critic: False # applies to open train only
mask_type: "team" # choices: [team, agent] 
# team: multiply default terminated and filled masks
# ind: compute individual mask from available actions
